[project]
name = "pod-cartoes"
version = "0.2.0"
description = "Data Lake PoD Cartões — reconstruído: local/S3, uv, linhagem e integridade"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.5.5",
    "openpyxl>=3.1.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "pyspark>=3.3",
    "python-dateutil",
]

[project.optional-dependencies]
aws = [
    "boto3",
]

[tool.uv]
package = false
