name: keep-streamlit-awake

on:
  schedule:
    # Executa a cada 8 horas
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Verificar Chrome
        run: |
          google-chrome --version || true

      - name: Abrir aplicação Streamlit
        run: |
          python << 'EOF'

          import os
          import time

          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          from selenium.webdriver.chrome.options import Options

          URL = "https://datalakecartoes.streamlit.app/"

          options = Options()

          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1920,1080")
          options.add_argument("--disable-gpu")

          print("=" * 80)
          print("Abrindo navegador...")
          print("=" * 80)

          driver = webdriver.Chrome(options=options)

          try:

              print(f"Acessando {URL}")

              driver.get(URL)

              wait = WebDriverWait(driver, 60)

              wait.until(
                  EC.presence_of_element_located((By.TAG_NAME, "body"))
              )

              time.sleep(15)

              print("=" * 80)
              print("Título:")
              print(driver.title)

              print("=" * 80)
              print("URL Final:")
              print(driver.current_url)

              print("=" * 80)
              print("Primeiros 1500 caracteres da página:")
              print(driver.page_source[:1500])

              screenshot = "streamlit.png"
              driver.save_screenshot(screenshot)

              print("=" * 80)
              print(f"Screenshot salvo em {screenshot}")

              html = driver.page_source.lower()

              erros = [
                  "error",
                  "404",
                  "500",
                  "not found",
                  "this app has gone to sleep",
                  "app is sleeping",
              ]

              encontrou = False

              for erro in erros:
                  if erro in html:
                      encontrou = True
                      print(f"Encontrado: {erro}")

              if encontrou:
                  raise Exception("A aplicação respondeu com uma página de erro.")

              print("=" * 80)
              print("Aplicação acessada com sucesso.")

          finally:
              driver.quit()

          EOF

      - name: Enviar screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-screenshot
          path: streamlit.png